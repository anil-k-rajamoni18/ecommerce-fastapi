[tool.poetry]
name = "ecommerce-api"
version = "0.1.0"
description = "FastAPI ecommerce backend"
authors = ["Kumar A"]

package-mode = false

[tool.poetry.dependencies]
python = "^3.11"

# Core Framework
fastapi = {extras = ["standard"], version = "^0.135.3"}
uvicorn = "0.43.0"
gunicorn = "25.3.0"

# Database
sqlalchemy = "2.0.49"
alembic = "1.18.4"
asyncpg = "0.31.0"

# Validation & Config
pydantic = "2.12.5"
pydantic-settings = "2.13.1"
python-dotenv = "1.2.2"

# Auth & Security
bcrypt = "5.0.0"
python-jose = "3.5.0"
cryptography = "46.0.6"

# API Utilities
python-multipart = "0.0.22"
email-validator = "2.3.0"

# HTTP Clients
httpx = "0.28.1"
requests = "2.33.1"

# Misc Utilities
PyYAML = "6.0.3"
RapidFuzz = "3.14.3"
psycopg2-binary = "^2.9.11"

[tool.poetry.group.dev.dependencies]
pytest = "9.0.2"
pytest-asyncio = "1.3.0"
pytest-cov = "7.1.0"
coverage = "7.13.5"

# Code Quality
ruff = "0.15.9"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"